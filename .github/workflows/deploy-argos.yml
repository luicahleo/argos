# .github/workflows/deploy-argos.yml
# GitHub Actions workflow to deploy ARGOS microservice to VPS

name: Deploy ARGOS to Production

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: Escribe PRODUCCION para confirmar el despliegue
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: argos-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  deploy-argos:
    if: github.ref == 'refs/heads/master' && inputs.confirmar == 'PRODUCCION'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Verificar CI verde del commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        conclusion="$(
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&branch=master&event=push&per_page=20" \
            --jq '.workflow_runs | sort_by(.updated_at) | last | .conclusion // ""'
        )"
        if [ "$conclusion" != "success" ]; then
          echo "El commit de master no tiene un CI verde."
          exit 1
        fi

    - name: Checkout código
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_SHA }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurar SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Instalar clave pública conocida del VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      run: |
        set -Eeuo pipefail
        install -d -m 0700 ~/.ssh
        printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 0600 ~/.ssh/known_hosts
        ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null

    - name: Crear estructura de directorios en VPS
      run: |
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "mkdir -p /var/apps/icarus/microservicios/argos/{logs,ARGOS}"

    - name: Subir archivos al VPS
      run: |
        rsync -avz --delete \
          --exclude='env/' \
          --exclude='env_new/' \
          --exclude='__pycache__/' \
          --exclude='*.pyc' \
          --exclude='.git/' \
          --exclude='logs/*.log' \
          ./ \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/apps/icarus/microservicios/argos/

    - name: Build y deploy ARGOS en VPS
      run: |
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
          cd /var/apps/icarus/microservicios/argos &&
          docker stop argos 2>/dev/null || true &&
          docker rm argos 2>/dev/null || true &&
          docker rmi argos:latest 2>/dev/null || true &&
          echo "Preparing logs directory..." &&
          mkdir -p logs &&
          sudo chown -R 1000:1000 logs &&
          sudo chmod -R 755 logs &&
          echo "Building ARGOS Docker image..." &&
          docker build --no-cache -f Dockerfile -t argos:latest . &&
          echo "Starting ARGOS container..." &&
          docker run -d \
            --name argos \
            --network trajano-shared-network \
            --restart unless-stopped \
            --env-file .env.production \
            -v $(pwd)/logs:/app/logs \
            argos:latest &&
          echo "Waiting 120 seconds for container initialization..." &&
          sleep 120 &&
          echo "Starting health checks..." &&
          for i in {1..120}; do
            sleep 2
            HTTP_CODE=$(docker exec argos curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health 2>/dev/null || echo "000")
            echo "DEBUG: HTTP_CODE = [$HTTP_CODE] en intento $i"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "ARGOS is healthy! (HTTP $HTTP_CODE)" &&
              break
            fi
            if [ $i -eq 120 ]; then
              echo "ARGOS failed to become healthy after 6 minutes" &&
              docker logs argos --tail 100 &&
              exit 1
            fi
            echo "Attempt $i/120: Waiting for ARGOS..."
          done &&
          echo "ARGOS Status:" &&
          docker ps | grep argos &&
          echo "ARGOS deployed successfully!"
        '

    - name: Notification on success
      if: success()
      run: |
        echo "✅ ARGOS microservice deployed successfully to production!"
        echo "Health check: http://argos:5000/health (internal Docker network)"

    - name: Notification on failure
      if: failure()
      run: |
        echo "❌ ARGOS deployment failed. Check logs above."
        exit 1
