name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar sintaxis Python
        run: python -m compileall -q ARGOS runserver.py benchmark_lfw.py

      - name: Construir imagen
        run: docker build --tag argos:ci .

      - name: Ejecutar pruebas
        run: docker run --rm --volume "${{ github.workspace }}:/repo:ro" --workdir /app argos:ci python -m unittest discover -s /repo/tests -p 'test_*.py' -v
